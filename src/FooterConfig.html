     JS
========================= -->

<script>
	const overlay = document.getElementById("mzk-overlay");

	const allModals = document.querySelectorAll(".mzk-modal");

	/* ===== 只显示一个弹窗 ===== */

	function showOnly(id) {
		allModals.forEach((modal) => {
			modal.classList.remove("show");
		});

		overlay.classList.add("show");

		document.getElementById(id).classList.add("show");

		document.body.style.overflow = "hidden";
	}

	/* ===== 关闭全部 ===== */

	function closeAllModals() {
		allModals.forEach((modal) => {
			modal.classList.remove("show");
		});

		overlay.classList.remove("show");

		document.body.style.overflow = "";
	}

	/* ===== 打开主弹窗 ===== */

	document.getElementById("mzk-easter-trigger").onclick = () => {
		showOnly("mzk-main-modal");
	};

	/* ===== 关闭按钮 ===== */

	document.querySelectorAll(".mzk-close").forEach((btn) => {
		btn.onclick = closeAllModals;
	});

	/* ===== 点击遮罩关闭 ===== */

	overlay.onclick = closeAllModals;

	/* ===== 今日人品 ===== */

	function openLuck() {
		showOnly("luck-modal");
	}

	function generateLuck() {
		const num = Math.floor(Math.random() * 101);

		let text = "";

		if (num >= 90) {
			text = "欧皇降临";
		} else if (num >= 70) {
			text = "运气不错";
		} else if (num >= 40) {
			text = "一般般";
		} else {
			text = "今天不宜抽卡";
		}

		document.getElementById("luck-number").innerHTML = `${num}
    <div style="
      font-size:24px;
      margin-top:10px;
    ">
      ${text}
    </div>`;
	}

	/* ===== 惊喜 ===== */

	function openSurprise() {
		showOnly("surprise-modal");
	}

	function openVideoPage() {
		window.open("/video/Never Gonna Give You Up.mp4", "_blank");
	}

	/* ===== 套娃 ===== */

	function openNothing() {
		showOnly("nested-1");
	}

	function openNested(level) {
		showOnly(`nested-${level}`);
	}
</script>
